[project]
name = "refrac"
version = "0.1.0"
description = "Seismic refraction interpretation from first-break picks"
authors = [
    { name = "cadu-sg", email = "eduardo.garabito@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
]

[project.scripts]
refrac = "refrac.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
